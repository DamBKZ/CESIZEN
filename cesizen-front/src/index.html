<!doctype html>
<html lang="fr">

<head>
  <meta charset="utf-8">

  <title>CESIZen – Bien-être & Gestion du stress</title>

  <base href="/">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="theme-color" content="#7cb342">
  <meta name="description" content="CESIZen – Plateforme de bien-être, questionnaire de stress et accompagnement.">
  <meta name="author" content="CESIZen">

  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Roboto, sans-serif;
      background: #ffffff;
    }

    #app-loader {
      position: fixed;
      inset: 0;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      background: linear-gradient(180deg,
          #ffffff 0%,
          #f4f8f2 100%);

      z-index: 9999;

      transition:
        opacity 0.3s ease,
        visibility 0.3s ease;
    }

    .loader-logo {
      width: 130px;
      margin-bottom: 24px;

      opacity: 0.95;

      animation: float 2.5s ease-in-out infinite;
    }

    .loader {
      width: 42px;
      height: 42px;

      border: 4px solid #7cb342;
      border-top-color: transparent;

      border-radius: 50%;

      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes float {
      0% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-8px);
      }

      100% {
        transform: translateY(0px);
      }
    }
  </style>
</head>

<body>

  <div id="app-loader">

    <img src="/cesizen_loader.svg" alt="Logo CESIZen" class="loader-logo">

    <div class="loader"></div>

  </div>

  <app-root></app-root>

  <script>
    window.addEventListener('load', () => {
      const loader = document.getElementById('app-loader');

      if (loader) {
        loader.style.opacity = '0';
        loader.style.visibility = 'hidden';

        setTimeout(() => {
          loader.remove();
        }, 300);
      }
    });
  </script>

</body>

</html>
