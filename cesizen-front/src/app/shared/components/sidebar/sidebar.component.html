<aside class="sidebar">
    @if (isAuthenticated()) {

    <div class="brand-block">
        <div class="brand-line">
            <img class="brand-logo" src="/Logo.png" alt="Logo CESIZEN" />
            <div>
                <div class="brand-title">CESIZEN</div>
                <div class="brand-subtitle">Bien-être & Gestion du stress</div>
            </div>
        </div>

        <button class="logout-btn" type="button" (click)="logout(); $event.stopPropagation()" [disabled]="isLoggingOut">
            <span *ngIf="!isLoggingOut">Déconnexion</span>
            <span *ngIf="isLoggingOut">Déconnexion…</span>
        </button>
    </div>

    <div class="profile-entry">
        <span class="profile-label">Espace personnel</span>
        <a routerLink="/profile" routerLinkActive="active" class="profile-link">
            Mon profil
        </a>
    </div>

    <nav class="menu">
        <a routerLink="/diagnostic" routerLinkActive="active">
            Diagnostic
        </a>

        <a routerLink="/information/list" routerLinkActive="active">
            Informations
        </a>

        @if (role()?.roleName === 'ADMIN') {
        <a routerLink="/admin/dashboard" routerLinkActive="active" class="back-office-link">
            Back-office
        </a>

        <a routerLink="/logs" routerLinkActive="active">
            Logs
        </a>
        }

    </nav>

    }

</aside>
