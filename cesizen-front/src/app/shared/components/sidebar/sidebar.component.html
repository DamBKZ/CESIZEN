<aside class="sidebar">
    @if (isAuthenticated()) {
    <div class="brand-block">
        <div class="brand-line">
            <img class="brand-logo" src="/Logo.png" alt="Logo CESIZEN" />

            <div>
                <div class="brand-title">CESIZEN</div>

                <div class="brand-subtitle">
                    Bien-être & Gestion du stress
                </div>
            </div>
        </div>

        <button class="logout-btn" type="button" [disabled]="isLoggingOut()" (click)="logout()">
            @if (isLoggingOut()) {
            Déconnexion…
            } @else {
            Déconnexion
            }
        </button>
    </div>

    <div class="profile-entry">
        <span class="profile-label">
            Espace personnel
        </span>

        <a class="profile-link" routerLink="/profile" routerLinkActive="active">
            Mon profil
        </a>
    </div>

    <nav class="menu" aria-label="Navigation principale">
        <a routerLink="/diagnostic" routerLinkActive="active">
            Diagnostic
        </a>

        <a routerLink="/informations/list" routerLinkActive="active">
            Informations
        </a>

        @if (role()?.roleName === 'ADMIN') {
        <a class="back-office-link" routerLink="/admin/dashboard" routerLinkActive="active">
            Back-office
        </a>

        <a routerLink="/admin/logs" routerLinkActive="active">
            Logs
        </a>
        }
    </nav>
    }
</aside>
