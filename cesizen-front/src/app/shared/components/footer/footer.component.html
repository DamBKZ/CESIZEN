<footer class="footer">

    <div class="footer-left">
        <button type="button" class="link-btn" (click)="openLegal()">
            Mentions légales
        </button>

        <button type="button" class="link-btn" (click)="openPrivacy()">
            Confidentialité
        </button>

        <button type="button" class="link-btn" (click)="openCookies()">
            Cookies
        </button>
    </div>

    <div class="footer-center">
        <span>
            © {{ currentYear }} CESIZEN — Tous droits réservés

            @if (showApplicationVersion) {
            <span class="footer-version">
                — v{{ applicationVersion }}
            </span>
            }
        </span>
    </div>

    <div class="footer-right">
        <a class="contact-btn" href="mailto:damien.baczkiewicz@viacesi.fr">
            <mat-icon>mail</mat-icon>
            Contacter
        </a>
    </div>

</footer>
