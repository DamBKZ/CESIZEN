<div class="list-container">

    <p class="eyebrow">Questionnaire de stress</p>
    <h1>Évaluez votre niveau de stress en quelques clics</h1>
    <p class="subtitle">Le questionnaire reprend les événements de vie. Cochez ce qui vous
        correspond pour obtenir votre score total.</p>

    <div class="hero-card">
        <div>
            <p class="hero-label">Format</p>
            <strong>Questions à cocher</strong>
        </div>
        <div>
            <p class="hero-label">Résultat</p>
            <strong>Score total + niveau de risque</strong>
        </div>
    </div>

    <button class="btn-primary" type="button" (click)="startDiagnostic()">
        Commencer le questionnaire
    </button>

</div>
