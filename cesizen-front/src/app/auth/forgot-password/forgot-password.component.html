<div class="auth-page">
    <div class="auth-content">
        <div class="auth-card">

            <h1 class="auth-title">Mot de passe oublié</h1>

            <p class="auth-subtitle">
                Entrez votre adresse email pour recevoir un lien de réinitialisation.
            </p>

            <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">

                <div class="auth-field">
                    <label class="auth-label">Email</label>
                    <input class="auth-input" type="email" formControlName="email" />

                    @if (form.get('email')?.touched && form.get('email')?.invalid) {
                    <small class="auth-error">Email invalide</small>
                    }
                </div>

                <button type="submit" class="auth-primary">Envoyer le lien</button>

            </form>

            <div class="auth-links">
                <a class="auth-link" routerLink="/login">Retour à la connexion</a>
            </div>

        </div>
    </div>

</div>
