<div class="auth-page">
    <app-header></app-header>

    <div class="auth-content">
        <div class="auth-card">

            <h1 class="auth-title">Connexion</h1>

            <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">

                <div class="auth-field">
                    <label class="auth-label">Email</label>
                    <input class="auth-input" type="email" formControlName="email" />

                    @if (form.get('email')?.touched && form.get('email')?.invalid) {
                    <small class="auth-error">Email invalide</small>
                    }
                </div>

                <div class="auth-field">
                    <label class="auth-label">Mot de passe</label>
                    <input class="auth-input" type="password" formControlName="password" />

                    @if (form.get('password')?.touched && form.get('password')?.invalid) {
                    <small class="auth-error">Mot de passe requis</small>
                    }
                </div>

                <button type="submit" class="auth-primary">Se connecter</button>

            </form>

            <div class="auth-links">
                <a class="auth-link" routerLink="/register">
                    Créer un compte
                </a>

                <a class="auth-link" routerLink="/auth/forgot-password">
                    Mot de passe oublié ?
                </a>
            </div>


        </div>
    </div>

    <app-footer></app-footer>
</div>
