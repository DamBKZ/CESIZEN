<h1 class="title">Gestion des utilisateurs</h1>

<table mat-table [dataSource]="users" class="mat-elevation-z2">

    <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let u">{{ u.email }}</td>
    </ng-container>

    <ng-container matColumnDef="pseudo">
        <th mat-header-cell *matHeaderCellDef>Pseudo</th>
        <td mat-cell *matCellDef="let u">{{ u.pseudo }}</td>
    </ng-container>

    <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef>Rôle</th>
        <td mat-cell *matCellDef="let u">{{ u.role.roleName }}</td>
    </ng-container>

    <ng-container matColumnDef="active">
        <th mat-header-cell *matHeaderCellDef>Actif</th>
        <td mat-cell *matCellDef="let u">
            <span class="status" [class.active]="u.active" [class.inactive]="!u.active">
                {{ u.active ? 'Oui' : 'Non' }}
            </span>
        </td>
    </ng-container>

    <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let u">

            <button *ngIf="!u.active" mat-icon-button color="primary" (click)="activate(u.userId)">
                <mat-icon>check_circle</mat-icon>
            </button>

            <button *ngIf="u.active" mat-icon-button color="warn" (click)="deactivate(u.userId)">
                <mat-icon>block</mat-icon>
            </button>

            <button mat-icon-button color="warn" (click)="delete(u.userId)">
                <mat-icon>delete</mat-icon>
            </button>

        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

</table>
