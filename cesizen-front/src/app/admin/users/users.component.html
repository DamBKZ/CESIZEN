<h1 class="title">Gestion des utilisateurs</h1>

<table mat-table [dataSource]="users" class="mat-elevation-z2">

    <!-- Email -->
    <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let u">{{ u.email }}</td>
    </ng-container>

    <!-- Firstname -->
    <ng-container matColumnDef="firstname">
        <th mat-header-cell *matHeaderCellDef>Prénom</th>
        <td mat-cell *matCellDef="let u">{{ u.firstname }}</td>
    </ng-container>

    <!-- Lastname -->
    <ng-container matColumnDef="lastname">
        <th mat-header-cell *matHeaderCellDef>Nom</th>
        <td mat-cell *matCellDef="let u">{{ u.lastname }}</td>
    </ng-container>

    <!-- Role -->
    <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef>Rôle</th>
        <td mat-cell *matCellDef="let u">{{ u.role }}</td>
    </ng-container>

    <!-- Active -->
    <ng-container matColumnDef="active">
        <th mat-header-cell *matHeaderCellDef>Actif</th>
        <td mat-cell *matCellDef="let u">
            <span [class.active]="u.active" [class.inactive]="!u.active">
                {{ u.active ? 'Oui' : 'Non' }}
            </span>
        </td>
    </ng-container>

    <!-- Actions -->
    <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let u">

            <button mat-icon-button color="primary" (click)="activate(u.id)" *ngIf="!u.active">
                <mat-icon>check_circle</mat-icon>
            </button>

            <button mat-icon-button color="warn" (click)="deactivate(u.id)" *ngIf="u.active">
                <mat-icon>block</mat-icon>
            </button>

            <button mat-icon-button color="warn" (click)="delete(u.id)">
                <mat-icon>delete</mat-icon>
            </button>

        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

</table>
