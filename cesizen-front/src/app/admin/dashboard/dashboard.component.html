<h1 class="title">Dashboard administrateur</h1>

@if (loading()) {
<p>Chargement des statistiques...</p>
} @else {
<div class="kpi-grid">
    @for (stat of stats(); track stat.key) {
    <mat-card class="kpi-card">
        <mat-icon class="kpi-icon">
            {{ stat.icon }}
        </mat-icon>

        <div class="kpi-content">
            <span class="kpi-value">
                {{ stat.value }}
            </span>

            <span class="kpi-label">
                {{ stat.label }}
            </span>
        </div>
    </mat-card>
    }
</div>
}

<div class="actions">
    <button mat-raised-button color="primary" type="button" (click)="goToUsers()">
        Gérer les utilisateurs
    </button>

    <button mat-raised-button color="accent" type="button" (click)="goToInformations()">
        Gérer les informations
    </button>
</div>
