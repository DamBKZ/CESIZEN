<h1 class="title">Dashboard Administrateur</h1>

<div class="kpi-grid">
    @for (s of stats; track s.key) {
    <mat-card class="kpi-card">
        <mat-icon class="kpi-icon">{{ s.icon }}</mat-icon>

        <div class="kpi-content">
            <span class="kpi-value">{{ s.value }}</span>
            <span class="kpi-label">{{ s.label }}</span>
        </div>
    </mat-card>
    }
</div>
