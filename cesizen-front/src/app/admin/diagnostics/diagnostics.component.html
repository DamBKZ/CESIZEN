<h1 class="title">Gestion des diagnostics</h1>

<table mat-table [dataSource]="diagnostics" class="mat-elevation-z2">

    <ng-container matColumnDef="user">
        <th mat-header-cell *matHeaderCellDef>Utilisateur</th>
        <td mat-cell *matCellDef="let d">{{ d.userEmail }}</td>
    </ng-container>

    <ng-container matColumnDef="score">
        <th mat-header-cell *matHeaderCellDef>Score</th>
        <td mat-cell *matCellDef="let d">{{ d.score }}</td>
    </ng-container>

    <ng-container matColumnDef="risk">
        <th mat-header-cell *matHeaderCellDef>Risque</th>
        <td mat-cell *matCellDef="let d">
            <span class="risk" [class.low]="d.riskLevel === 'Faible'" [class.medium]="d.riskLevel === 'Moyen'"
                [class.high]="d.riskLevel === 'Élevé'">
                {{ d.riskLevel }}
            </span>
        </td>
    </ng-container>

    <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>Date</th>
        <td mat-cell *matCellDef="let d">
            {{ d.createdAt | date:'dd/MM/yyyy HH:mm' }}
        </td>
    </ng-container>

    <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let d">
            <button mat-icon-button color="warn" (click)="delete(d.id)">
                <mat-icon>delete</mat-icon>
            </button>
        </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

</table>
