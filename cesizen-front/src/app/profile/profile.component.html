<h1>Mon Profil</h1>

<p class="profile-intro">
    L'encart pseudo et email vous permet de modifier votre pseudo et/ou votre adresse email.
</p>

<button class="back-btn" type="button" (click)="backToInformations()">
    Revenir à la liste des informations
</button>

<form [formGroup]="form" (ngSubmit)="save()">

    <mat-form-field appearance="outline">
        <mat-label>Pseudo</mat-label>
        <input matInput formControlName="pseudo">
    </mat-form-field>

    <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput formControlName="email">
    </mat-form-field>

    <button mat-raised-button color="primary" type="submit">
        Enregistrer
    </button>

</form>

<button mat-button color="accent" type="button" (click)="openChangePassword()">
    Modifier mon mot de passe
</button>

<button mat-button color="accent" type="button" (click)="openHistory()">
    Voir l'historique de mes diagnostics
</button>

<button mat-button color="warn" type="button" (click)="deleteAccount()">
    Supprimer mon compte
</button>
