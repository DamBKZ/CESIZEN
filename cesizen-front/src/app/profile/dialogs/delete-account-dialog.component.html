<h2 mat-dialog-title>Suppression du compte</h2>

<mat-dialog-content>
    <p>êtes-vous sûr de vouloir supprimer votre compte ?</p>

    <mat-checkbox [checked]="confirmed" (change)="confirmed = $event.checked">Oui</mat-checkbox>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Annuler</button>
    <button mat-raised-button color="warn" type="button" [disabled]="!confirmed" (click)="confirm()">
        Supprimer
    </button>
</mat-dialog-actions>
