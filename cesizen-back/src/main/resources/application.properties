# =============================================================================
# DATASOURCE
# =============================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# =============================================================================
# JPA / HIBERNATE
# =============================================================================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false

# =============================================================================
# LIQUIBASE
# =============================================================================
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# =============================================================================
# SERVEUR
# =============================================================================
server.port=${SERVER_PORT:8080}

# =============================================================================
# H2
# =============================================================================
spring.h2.console.enabled=false

# =============================================================================
# SPRINGDOC / SWAGGER
# =============================================================================
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# =============================================================================
# JWT
# =============================================================================
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}

# =============================================================================
# RESET PASSWORD
# =============================================================================
reset-password.expiration-minutes=${RESET_PASSWORD_EXPIRATION_MINUTES:30}

# =============================================================================
# COOKIES
# =============================================================================
app.cookies.secure=${APP_COOKIES_SECURE:true}

# Actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false

# Informations publiques minimales
management.info.env.enabled=true
info.app.name=CESIZen Backend
info.app.description=API REST CESIZen
info.app.version=@project.version@

# =============================================================================
# MAIL
# =============================================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =============================================================================
# FRONTEND
# =============================================================================
app.frontend-url=${FRONTEND_URL}

dotenv.directory=./


