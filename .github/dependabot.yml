version: 2

updates:
  - package-ecosystem: maven
    directory: /cesizen-back
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Paris
    target-branch: develop
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - component:backend
      - type:maintenance
    commit-message:
      prefix: "chore(deps-back)"
    groups:
      backend-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /cesizen-front
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
      timezone: Europe/Paris
    target-branch: develop
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - component:frontend
      - type:maintenance
    commit-message:
      prefix: "chore(deps-front)"
    groups:
      frontend-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "07:30"
      timezone: Europe/Paris
    target-branch: develop
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - component:deployment
      - type:maintenance
    commit-message:
      prefix: "chore(deps-ci)"
