version: 2

updates:
  # Dépendances Maven du backend
  - package-ecosystem: "maven"
    directory: "/cesizen-back"
    target-branch: "develop"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Paris"

    labels:
      - "dependencies"
      - "backend"

    open-pull-requests-limit: 5

    groups:
      backend-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"


  # Dépendances npm du frontend
  - package-ecosystem: "npm"
    directory: "/cesizen-front"
    target-branch: "develop"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "Europe/Paris"

    labels:
      - "dependencies"
      - "frontend"

    open-pull-requests-limit: 5

    groups:
      frontend-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"


  # Actions utilisées dans les workflows GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:30"
      timezone: "Europe/Paris"

    labels:
      - "dependencies"
      - "ci"

    open-pull-requests-limit: 3

    groups:
      github-actions-minor-patch:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

    commit-message:
      prefix: "chore"
      include: "scope"


  # Images référencées dans les Dockerfiles
  - package-ecosystem: "docker"
    directory: "/cesizen-back"
    target-branch: "develop"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:45"
      timezone: "Europe/Paris"

    labels:
      - "dependencies"
      - "backend"
      - "docker"

    open-pull-requests-limit: 3

    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

    commit-message:
      prefix: "chore"
      include: "scope"


  - package-ecosystem: "docker"
    directory: "/cesizen-front"
    target-branch: "develop"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Paris"

    labels:
      - "dependencies"
      - "frontend"
      - "docker"

    open-pull-requests-limit: 3

    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

    commit-message:
      prefix: "chore"
      include: "scope"


  - package-ecosystem: "docker"
    directory: "/honeypot"
    target-branch: "develop"

    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:15"
      timezone: "Europe/Paris"

    labels:
      - "dependencies"
      - "security"
      - "docker"

    open-pull-requests-limit: 3

    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

    commit-message:
      prefix: "chore"
      include: "scope"
