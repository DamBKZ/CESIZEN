name: CI CESIZen

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - tests Maven
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: cesizen-back

    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v5

      - name: Installer Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compiler et exécuter les tests
        run: mvn --batch-mode --no-transfer-progress clean verify

  frontend:
    name: Frontend - build Angular
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: cesizen-front

    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cesizen-front/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le frontend
        run: npm run build
