{
  "device.node_id": "cesizen-honeypot",
  "ip.ignorelist": [],

  "git.enabled": false,
  "ftp.enabled": true,
  "ftp.port": 2121,

  "http.enabled": true,
  "http.port": 8088,
  "http.skin": "nasLogin",

  "httpproxy.enabled": false,
  "logger": {
    "class": "PyLogger",
    "kwargs": {
      "formatters": {
        "plain": {
          "format": "%(message)s"
        }
      },
      "handlers": {
        "console": {
          "class": "logging.StreamHandler",
          "stream": "ext://sys.stdout"
        }
      }
    }
  },

  "mysql.enabled": false,
  "portscan.enabled": false,
  "redis.enabled": false,
  "sip.enabled": false,
  "smb.enabled": false,
  "snmp.enabled": false,
  "ssh.enabled": true,
  "ssh.port": 2222,
  "tcpbanner.enabled": false,
  "telnet.enabled": false,
  "tftp.enabled": false,
  "vnc.enabled": false
}
