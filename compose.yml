services:
  database:
    image: mariadb:11
    container_name: cesizen-database
    restart: unless-stopped

    environment:
      MARIADB_DATABASE: cesizen
      MARIADB_USER: cesizen
      MARIADB_PASSWORD: cesizen_local_password
      MARIADB_ROOT_PASSWORD: cesizen_root_local_password

    ports:
      - "3308:3306"

    volumes:
      - cesizen-database-data:/var/lib/mysql

    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build:
      context: ./cesizen-back
      dockerfile: Dockerfile

    image: cesizen-back:local
    container_name: cesizen-back
    restart: unless-stopped

    depends_on:
      database:
        condition: service_healthy

    environment:
      DB_URL: jdbc:mariadb://database:3306/cesizen
      DB_USERNAME: cesizen
      DB_PASSWORD: cesizen_local_password
      JWT_SECRET: local-development-secret-key-change-before-production-123456789
      SERVER_PORT: "8080"
      FRONTEND_URL: http://localhost:4200
      APP_COOKIES_SECURE: "false"
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""

    ports:
      - "8081:8080"

    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1:8080/actuator/health/readiness
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./cesizen-front
      dockerfile: Dockerfile

    image: cesizen-front:local
    container_name: cesizen-front
    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy

    ports:
      - "4200:8080"

volumes:
  cesizen-database-data:
