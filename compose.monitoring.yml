services:
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: cesizen-cadvisor
    restart: unless-stopped
    privileged: true
    command:
      - --docker_only=true
      - --housekeeping_interval=10s
    ports:
      - "8082:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - monitoring

  alertmanager:
    image: prom/alertmanager:v0.30.1
    container_name: cesizen-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - cesizen-alertmanager-data:/alertmanager
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:v3.7.3
    container_name: cesizen-prometheus
    restart: unless-stopped
    depends_on:
      - cadvisor
      - alertmanager
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - cesizen-prometheus-data:/prometheus
    networks:
      - monitoring

  grafana:
    image: grafana/grafana-oss:12.3.3
    container_name: cesizen-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    env_file:
      - .env.monitoring
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.gmail.com:587
      - GF_SMTP_USER=${GRAFANA_SMTP_USER}
      - GF_SMTP_PASSWORD=${GRAFANA_SMTP_PASSWORD}
      - GF_SMTP_FROM_ADDRESS=${GRAFANA_SMTP_FROM_ADDRESS}
      - GF_SMTP_FROM_NAME=CESIZen Alerting
      - GF_SMTP_STARTTLS_POLICY=MandatoryStartTLS
    ports:
      - "3000:3000"
    volumes:
      - cesizen-grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - monitoring

  loki:
    image: grafana/loki:3.6.3
    container_name: cesizen-loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/loki.yml
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - cesizen-loki-data:/loki
    networks:
      - monitoring

  alloy:
    image: grafana/alloy:v1.12.2
    container_name: cesizen-alloy
    restart: unless-stopped
    depends_on:
      - loki
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
    ports:
      - "12345:12345"
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - monitoring


networks:
  monitoring:
    name: cesizen-monitoring
    driver: bridge

volumes:
  cesizen-prometheus-data:
  cesizen-alertmanager-data:
  cesizen-grafana-data:
  cesizen-loki-data:
